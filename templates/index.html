<!DOCTYPE html>

<head>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- <link rel="stylesheet" type="text/css" href="static/style.css"> -->
    <style>
        .chat {
            display: flex;
            flex-direction: column;
        }

        .background {
            box-sizing: border-box;
            background-color: #C1CEDE;
            border: 1px solid #000;
            width: 400px;
            height: 600px;
            margin-right: 5px;
            overflow: auto;

            position: relative;
        }

        .Input-area {
            display: flex;
            width: 400px;
            height: 70px;
            border: 1px solid black;
        }

        textarea:focus {
            outline: none;
        }

        .Input-text {
            min-width: 350px;
            min-height: 60px;
            resize: none;
            border: none;
        }

        .send-button {
            background-color: #FEDE00;
            color: #000000;
            border: none;
            padding: 5px;
            margin-right: 10px;
            margin-bottom: 10px;
            align-self: flex-end
        }

        .chat {
            display: flex;
            align-items: flex-start;
            padding: 7px;
        }

        .ch1 {
            flex-direction: row-reverse;
        }

        .textbox1 {
            position: relative;
            max-width: 280px;
            padding: 7px;
            margin-top: 5px;
            margin-bottom: 5px;
            font-size: 13px;
            border-radius: 5px;
            background-color: #ffea00;
        }

        .chat .textbox1::before {
            content: attr(data-time);
            font-size: 12px;
            position: absolute;
            left: -60px;
            bottom: 1px;
        }

        .textbox2 {
            position: relative;
            display: inline-block;
            max-width: 280px;
            padding: 7px;
            margin-top: 5px;
            margin-bottom: 5px;
            font-size: 13px;
            border-radius: 5px;
            background-color: #ffffff;
        }

        .chat.ch2 .textbox2::before {
            content: attr(data-time);
            font-size: 12px;
            position: absolute;
            right: -60px;
            bottom: 1px;
        }

        .chat.ch2 .textbox2::before {
            content: attr();
            position: absolute;
            right: -60px;
            bottom: 1px;
        }

        .UserId-area {
            display: flex;
            width: 400px;
            height: 50px;
            border: 1px solid black;
        }

        .Input-UserId {
            width: 350px;
            height: 40px;
            resize: none;
            border: 1px solid black;
            margin: 5px;
        }

        .sendUserId-button {
            background-color: #FEDE00;
            color: #000000;
            border: none;
            padding: 5px;
            margin: 5px;
        }

        .response.Image1 {
            width: 20px;
            margin-top: 15px;
            margin-right: 70px;
        }

        .response.Image2 {
            width: 20px;
            /* margin-left: 90px; */
        }

        .responseText {
            position: absolute;
            width: 355px;
            height: 40px;
            padding: 10px;

            border: 1px solid #000;
            font-size: 15px;
            background-color: #ffffff;
            ;
        }
    </style>
    <script>
        $(document).ready(function () {
            function getCookie(name) {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    // 쿠키의 이름과 값 분리
                    const [cookieName, cookieValue] = cookie.split('=');
                    if (cookieName === name) {
                        // 찾은 경우 쿠키의 값 반환
                        return decodeURIComponent(cookieValue);
                    }
                }
                // 해당 이름의 쿠키를 찾지 못한 경우 null 반환
                return null;
            }

            var user_id = getCookie('user_id');
            var friend_name = getCookie('friend_name');
            var groupChat = getCookie('groupChat');
            console.log("groupChat" + groupChat);
            submitUserId();

            function addMessageToDB(groupChat, user_id, friend_name, message, timeString, response, responseId, responsetext) {
                var data = { "groupChat": groupChat, "user_id": user_id, "friend_name": friend_name, "message": message, "timeString": timeString, "response": response, "responseId": responseId, "responsetext": responsetext };
                $.ajax({
                    url: "/postChat",
                    type: "post",
                    contentType: "application/json",
                    dataType: "json",
                    data: JSON.stringify(data),
                    success: function () {
                        console.log("success");
                    },
                })
                ws.send(JSON.stringify(data))
            }

            function addChat1(user_id, text, timeString) {
                var newDiv = $('<div>').addClass('chat ch1');
                var textboxDiv = $('<div>').addClass('textbox1').attr('data-time', timeString).html(text);

                //response
                var responseImage = 'static/image/response.png';
                var responseDiv = $('<img>').attr('src', responseImage).attr('alt', '답장 이미지');
                responseDiv.addClass('response Image1');

                responseDiv.click(function () {
                    var responseText = $('<div>').addClass('responseText').html('나 <small> 에 대한 답장</small><br>' + textboxDiv.text());

                    var b = $('#background');

                    responseText.css({
                        top: b.prop("scrollHeight") - 60 + 'px',
                    });

                    if ($('.responseText').length > 0) {
                        // 있다면 삭제
                        $('.responseText').remove();
                    }
                    $('#background').append(responseText);
                    b.scrollTop(b1.prop("scrollHeight"));
                });
                newDiv.append(textboxDiv);
                newDiv.append(responseDiv);

                $('#background').append(newDiv);

                var b1 = $('#background');
                b1.scrollTop(b1.prop("scrollHeight"));
            }

            function addResponseChat1(user_id, text, timeString, resId, resText) {
                var newDiv = $('<div>').addClass('chat ch1');
                var textboxDiv = $('<div>').addClass('textbox1').attr('data-time', timeString).html(resId+'<small>&nbsp;에 대한 답장<br>' + resText + '</small><br><hr>' + text);

                var responseImage = 'static/image/response.png';
                var responseDiv = $('<img>').attr('src', responseImage).attr('alt', '답장 이미지');
                responseDiv.addClass('response Image1');

                responseDiv.click(function () {
                    var responseText = $('<div>').addClass('responseText').html('나' + '<small> 에 대한 답장</small><br>' + textboxDiv.text());

                    var b = $('#background');

                    responseText.css({
                        top: b.prop("scrollHeight") - 40 + 'px',
                    });

                    if ($('.responseText').length > 0) {
                        // 있다면 삭제
                        $('.responseText').remove();
                    }
                    $('#background').append(responseText);
                    b.scrollTop(b1.prop("scrollHeight"));
                });

                newDiv.append(textboxDiv);
                newDiv.append(responseDiv);

                $('#background').append(newDiv);

                var b1 = $('#background');
                b1.scrollTop(b1.prop("scrollHeight"));
            }

            function addChat2(friend_name, text, timeString) {
                var friend = $('<div>').addClass('userName').text(friend_name).css('font-size', '13px');;
                var newDiv2 = $('<div>').addClass('chat ch2');
                var textboxDiv2 = $('<div>').addClass('textbox2').attr('data-time', timeString).html(text);
                newDiv2.append(friend);
                newDiv2.append(textboxDiv2);

                //response
                var responseImage = 'static/image/response.png';
                var responseDiv = $('<img>').attr('src', responseImage).attr('alt', '답장 이미지');
                responseDiv.addClass('response Image2');

                responseDiv.click(function () {
                    var responseText = $('<div>').addClass('responseText').html(friend_name + '<small> 에 대한 답장</small><br>' + textboxDiv2.text());

                    var b = $('#background');

                    responseText.css({
                        top: b.prop("scrollHeight") - 40 + 'px',
                    });
                    if ($('.responseText').length > 0) {
                        // 있다면 삭제
                        $('.responseText').remove();
                    }
                    $('#background').append(responseText);
                    b.scrollTop(b1.prop("scrollHeight"));
                });

                newDiv2.append(friend);
                newDiv2.append(textboxDiv2);
                newDiv2.append(responseDiv);

                $('#background').append(newDiv2);

                var b1 = $('#background');
                b1.scrollTop(b1.prop("scrollHeight"));
            }

            function addResponseChat2(friend_name, text, timeString, resId, resText) {
                var friend = $('<div>').addClass('userName').text(friend_name).css('font-size', '13px');;
                var newDiv2 = $('<div>').addClass('chat ch2');
                var textboxDiv2 = $('<div>').addClass('textbox2').attr('data-time', timeString).html('<small>' + resId + '&nbsp;에 대한 답장<br>' + resText + '</small><br><hr>' + text);
                newDiv2.append(friend);
                newDiv2.append(textboxDiv2);

                //response
                var responseImage = 'static/image/response.png';
                var responseDiv = $('<img>').attr('src', responseImage).attr('alt', '답장 이미지');
                responseDiv.addClass('response Image2');

                responseDiv.click(function () {
                    var responseText = $('<div>').addClass('responseText').html(friend_name + '<small> 에 대한 답장</small><br>' + textboxDiv2.text());

                    var b = $('#background');

                    responseText.css({
                        top: b.prop("scrollHeight") - 40 + 'px',
                    });
                    if ($('.responseText').length > 0) {
                        // 있다면 삭제
                        $('.responseText').remove();
                    }
                    $('#background').append(responseText);
                    b.scrollTop(b1.prop("scrollHeight"));
                });

                newDiv2.append(friend);
                newDiv2.append(textboxDiv2);
                newDiv2.append(responseDiv);

                $('#background').append(newDiv2);

                var b1 = $('#background');
                b1.scrollTop(b1.prop("scrollHeight"));
            }

            var ws = new WebSocket("ws://localhost:8000/ws");
            ws.onmessage = function (event) {
                var confirm = 0;
                var data = JSON.parse(event.data);
                if (user_id != data.user_id) {
                    console.log(data);
                    if (data.groupChat == 0) {
                        if (user_id == data.friend_name) {
                            confirm = 1;
                        }
                    }
                    else {
                        confirm = 1;
                        var friendCookie = friend_name.split(',');
                        var friendData = data.friend_name.split(',');

                        for (var i = 0; i < friendCookie.length; i++) {
                            if (friendCookie[i].trim() !== friendData[i].trim()) {
                                // 하나라도 일치하지 않으면 false 반환
                                return confirm = 0;
                            }
                        }
                    }
                }

                if(confirm == 1){
                    if(data.response == 1){
                        addResponseChat2(data.user_id, data.message, data.timeString, data.responseId, data.responsetext)
                    }
                    else{
                        addChat2(data.user_id, data.message, data.timeString); 
                    }
                }
            };

            function submitText(event) {
                var response = 0;
                var response = 0;
                var response = 0;

                var textarea = $('#Input-text');
                var text = textarea.val();
                text = text.replace(/\n/g, '<br>').replace(/ /g, '&nbsp;')

                var now = new Date();
                var hours = now.getHours();
                var minutes = now.getMinutes();
                var ampm = hours >= 12 ? '오후' : '오전';
                hours = (hours % 12) || 12;
                hours = hours > 12 ? hours - 12 : hours;
                var minutesString = minutes < 10 ? '0' + minutes : minutes.toString();
                var timeString = ampm + ' ' + hours + ':' + minutesString;

                //response 일 때
                if ($('.responseText').length > 0) {
                    var splitArray = $('.responseText').html().split(/<small>.*?<\/small>|<br>/);

                    var resId = splitArray[0];
                    var restext = splitArray[2];

                    addResponseChat1(user_id, text, timeString, resId, restext);
                    addMessageToDB(groupChat, user_id, friend_name, text, timeString, 1, resId, restext);
                    $('.responseText').remove();
                }
                //아닐 때
                else {
                    addChat1(user_id, text, timeString);
                    addMessageToDB(groupChat, user_id, friend_name, text, timeString, 0, "", "");
                }

                textarea.val('');
            };

            //이전 대화 내역을 가져오는 함수
            function submitUserId() {
                $.getJSON("/getChat", function (chatHistory) {
                    $.each(chatHistory, function (key, value) {
                        if (value.response == 0) {
                            if (value.groupChat == 0) {
                                if (user_id == value.user_id) {
                                    if (friend_name == value.friend_name) {
                                        addChat1(value.user_id, value.message, value.timeString)
                                    }
                                }
                                else if (user_id == value.friend_name) {
                                    if (friend_name == value.user_id) {
                                        addChat2(value.user_id, value.message, value.timeString)
                                    }
                                }
                            }
                            else {
                                //Cookie에 있는 friendNames
                                var friendNamesCookie = friend_name.split(',').map(function (name) {
                                    return name.trim();
                                });
                                var trimmedFriendNamesCookie = [];

                                friendNamesCookie.forEach(function (friendNameCookie) {
                                    trimmedFriendNamesCookie.push(friendNameCookie);
                                });

                                //DB에 있는 friendNames
                                var friendNamesValue = value.friend_name.split(',').map(function (name) {
                                    return name.trim();
                                });
                                var trimmedFriendNamesValue = [];

                                friendNamesValue.forEach(function (friendNameValue) {
                                    trimmedFriendNamesValue.push(friendNameValue);
                                });

                                if (trimmedFriendNamesCookie.length == 1) {
                                    return;
                                }
                                var index = 0;
                                trimmedFriendNamesCookie.forEach(function (trimmedFriendNameCookie) {
                                    if (user_id == value.user_id) {
                                        if (trimmedFriendNameCookie == trimmedFriendNamesValue[index]) {
                                            addChat1(value.user_id, value.message, value.timeString)
                                            return;
                                        }
                                    }
                                    else if (user_id == trimmedFriendNamesValue[index]) {
                                        if (trimmedFriendNameCookie == value.user_id) {
                                            addChat2(trimmedFriendNameCookie, value.message, value.timeString)
                                        }
                                    }
                                });
                                index = index + 1;
                            }
                        }
                        else {
                            if (value.groupChat == 0) {
                                if (user_id == value.user_id) {
                                    if (friend_name == value.friend_name) {
                                        addResponseChat1(value.user_id, value.message, value.timeString, value.responseId, value.responsetext)
                                    }
                                }
                                else if (user_id == value.friend_name) {
                                    if (friend_name == value.user_id) {
                                        addResponseChat2(value.user_id, value.message, value.timeString, value.responseId, value.responsetext)
                                    }
                                }
                            }
                            else {
                                //Cookie에 있는 friendNames
                                var friendNamesCookie = friend_name.split(',').map(function (name) {
                                    return name.trim();
                                });
                                var trimmedFriendNamesCookie = [];

                                friendNamesCookie.forEach(function (friendNameCookie) {
                                    trimmedFriendNamesCookie.push(friendNameCookie);
                                });

                                //DB에 있는 friendNames
                                var friendNamesValue = value.friend_name.split(',').map(function (name) {
                                    return name.trim();
                                });
                                var trimmedFriendNamesValue = [];

                                friendNamesValue.forEach(function (friendNameValue) {
                                    trimmedFriendNamesValue.push(friendNameValue);
                                });

                                if (trimmedFriendNamesCookie.length == 1) {
                                    return;
                                }
                                var index = 0;
                                trimmedFriendNamesCookie.forEach(function (trimmedFriendNameCookie) {
                                    if (user_id == value.user_id) {
                                        if (trimmedFriendNameCookie == trimmedFriendNamesValue[index]) {
                                            addResponseChat1(value.user_id, value.message, value.timeString, value.responseId, value.responsetext)
                                            return;
                                        }
                                    }
                                    else if (user_id == trimmedFriendNamesValue[index]) {
                                        if (trimmedFriendNameCookie == value.user_id) {
                                            addResponseChat2(value.user_id, value.message, value.timeString, value.responseId, value.responsetext)
                                        }
                                    }
                                });
                                index = index + 1;
                            }
                        }
                    })
                })
            }

            $('#Input-text').on('keydown', function (event) {
                var textarea = $('#Input-text');
                if (event.keyCode === 13 && !event.shiftKey) {
                    if (textarea.val().trim() === "") {
                        event.preventDefault();
                    } else {
                        submitText();
                        event.preventDefault();
                    }
                } else if (event.keyCode === 13 && event.shiftKey) {
                    var currentValue = textarea.val();
                    textarea.val(currentValue + '\n');
                    event.preventDefault();
                }
            });

            $('#send-button').click(submitText);
        });
    </script>
</head>

<body>
    <div class="chat">
        <div class="background" id="background"></div>
        <!-- <div class="responseCase">dd</div> -->
        <div class="Input-area">
            <textarea class="Input-text" id="Input-text"></textarea>
            <button class="send-button" id="send-button">Send</button>
        </div>
    </div>
</body>

</html>
